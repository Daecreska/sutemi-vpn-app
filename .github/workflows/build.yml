name: Build SUTEMI VPN Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect Flutter project directory
        id: paths
        run: |
          if [ -f "mobile/pubspec.yaml" ]; then
            echo "dir=mobile" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 & NDK 28.2.13676358
        run: |
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Go 1.23 (for libbox.aar)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Flutter 3.41.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Ensure libbox.aar exists
        working-directory: ${{ steps.paths.outputs.dir }}
        run: |
          if [ ! -s "android/app/libs/libbox.aar" ]; then
            chmod +x scripts/build_libbox.sh
            ./scripts/build_libbox.sh
          fi

      - name: Ensure Android res files exist
        working-directory: ${{ steps.paths.outputs.dir }}
        run: |
          if [ ! -f "android/app/src/main/res/values/styles.xml" ] || [ ! -f "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png" ]; then
            RES_DIR="$(pwd)/android/app/src/main/res"
            flutter create --no-pub --platforms=android /tmp/flutter_res_tpl
            mkdir -p "$RES_DIR"
            (cd /tmp/flutter_res_tpl/android/app/src/main/res && find . -type f | while IFS= read -r f; do
              if [ ! -e "$RES_DIR/$f" ]; then
                mkdir -p "$(dirname "$RES_DIR/$f")"
                cp "$f" "$RES_DIR/$f"
              fi
            done)
          fi

      - name: Install Flutter packages & run Dart unit tests
        working-directory: ${{ steps.paths.outputs.dir }}
        run: |
          flutter pub get
          flutter test

      - name: Build Android APKs (Debug + Release split-per-abi)
        working-directory: ${{ steps.paths.outputs.dir }}
        run: |
          flutter build apk --debug
          flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sutemi-vpn-apks
          path: |
            ${{ steps.paths.outputs.dir }}/build/app/outputs/flutter-apk/*.apk
